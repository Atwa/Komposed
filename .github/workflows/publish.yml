name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish komposed + komposed-testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Publish both modules to local staging directory
        run: |
          ./gradlew \
            :komposed:publishReleasePublicationToMavenLocalRepository \
            :komposed-testing:publishReleasePublicationToMavenLocalRepository
        env:
          VERSION_NAME:     ${{ steps.version.outputs.VERSION }}
          GPG_PRIVATE_KEY:  ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_PASSWORD: ${{ secrets.GPG_KEY_PASSWORD }}

      - name: Bundle and upload to Maven Central Portal
        run: |
          cd build/local-publish
          zip -r ../../bundle.zip .
          cd ../..
          TOKEN=$(echo -n "${{ secrets.OSSRH_USERNAME }}:${{ secrets.OSSRH_PASSWORD }}" | base64 -w0)
          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $TOKEN" \
            --form bundle=@bundle.zip \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC"
