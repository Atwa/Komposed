name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish komposed + komposed-testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        id: version
        # Strips the leading 'v' so tag v1.2.3 becomes VERSION_NAME=1.2.3
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Publish :komposed
        run: ./gradlew :komposed:publishReleasePublicationToMavenCentralRepository
        env:
          VERSION_NAME:     ${{ steps.version.outputs.VERSION }}
          OSSRH_USERNAME:   ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD:   ${{ secrets.OSSRH_PASSWORD }}
          GPG_PRIVATE_KEY:  ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_PASSWORD: ${{ secrets.GPG_KEY_PASSWORD }}

      - name: Publish :komposed-testing
        run: ./gradlew :komposed-testing:publishReleasePublicationToMavenCentralRepository
        env:
          VERSION_NAME:     ${{ steps.version.outputs.VERSION }}
          OSSRH_USERNAME:   ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD:   ${{ secrets.OSSRH_PASSWORD }}
          GPG_PRIVATE_KEY:  ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_PASSWORD: ${{ secrets.GPG_KEY_PASSWORD }}
