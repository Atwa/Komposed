<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',sans-serif">
  <rect width="720" height="420" fill="#161b22"/>

  <text x="14" y="80"  fill="#8b949e" font-size="10" font-weight="600" transform="rotate(-90,14,80)"  text-anchor="middle">UNIT</text>
  <text x="14" y="210" fill="#8b949e" font-size="10" font-weight="600" transform="rotate(-90,14,210)" text-anchor="middle">INTEG</text>
  <text x="14" y="340" fill="#8b949e" font-size="10" font-weight="600" transform="rotate(-90,14,340)" text-anchor="middle">UTIL</text>

  <line x1="30" y1="140" x2="690" y2="140" stroke="#21262d" stroke-width="1"/>
  <line x1="30" y1="280" x2="690" y2="280" stroke="#21262d" stroke-width="1"/>

  <rect x="34" y="20" width="200" height="110" rx="10" fill="#042f2e" stroke="#0d9488" stroke-width="1.5"/>
  <text x="134" y="44" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="700">ReduceResult DSL</text>
  <line x1="44" y1="52" x2="224" y2="52" stroke="#134e4a" stroke-width="1"/>
  <text x="134" y="68" text-anchor="middle" fill="#2dd4bf" font-size="10">reducer.provide(fakeHandler)</text>
  <text x="134" y="84" text-anchor="middle" fill="#2dd4bf" font-size="10">  .given(state, action)</text>
  <text x="134" y="100" text-anchor="middle" fill="#0d9488" font-size="10">  .assertState(expected)</text>
  <text x="134" y="116" text-anchor="middle" fill="#0d9488" font-size="10">  .assertEffect&lt;T&gt;()</text>

  <rect x="254" y="20" width="200" height="110" rx="10" fill="#172554" stroke="#2563eb" stroke-width="1.5"/>
  <text x="354" y="44" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">State Projection</text>
  <line x1="264" y1="52" x2="444" y2="52" stroke="#1e3a8a" stroke-width="1"/>
  <text x="354" y="68" text-anchor="middle" fill="#60a5fa" font-size="10">Plain unit test on State data class</text>
  <text x="354" y="84" text-anchor="middle" fill="#3b82f6" font-size="10">deliveryFee · orderGrandTotal</text>
  <text x="354" y="100" text-anchor="middle" fill="#3b82f6" font-size="10">selectedAddress · toCheckoutAction()</text>
  <text x="354" y="116" text-anchor="middle" fill="#1d4ed8" font-size="10">No coroutines needed</text>

  <rect x="474" y="20" width="210" height="110" rx="10" fill="#2e1065" stroke="#9333ea" stroke-width="1.5"/>
  <text x="579" y="44" text-anchor="middle" fill="#d8b4fe" font-size="12" font-weight="700">EffectHandler I/O</text>
  <line x1="484" y1="52" x2="674" y2="52" stroke="#4c1d95" stroke-width="1"/>
  <text x="579" y="68" text-anchor="middle" fill="#c084fc" font-size="10">Fake Repository interface</text>
  <text x="579" y="84" text-anchor="middle" fill="#c084fc" font-size="10">success → correct action type</text>
  <text x="579" y="100" text-anchor="middle" fill="#9333ea" font-size="10">failure → error action + message</text>
  <text x="579" y="116" text-anchor="middle" fill="#7e22ce" font-size="10">No mocking framework required</text>

  <rect x="34" y="156" width="310" height="110" rx="10" fill="#431407" stroke="#ea580c" stroke-width="1.5"/>
  <text x="189" y="180" text-anchor="middle" fill="#fdba74" font-size="12" font-weight="700">TestStore</text>
  <line x1="44" y1="188" x2="334" y2="188" stroke="#7c2d12" stroke-width="1"/>
  <text x="189" y="204" text-anchor="middle" fill="#fb923c" font-size="10">Wraps real createStore with recording middleware</text>
  <text x="189" y="220" text-anchor="middle" fill="#fb923c" font-size="10">store.dispatch(action)  ·  advanceUntilIdle()</text>
  <text x="189" y="236" text-anchor="middle" fill="#c2410c" font-size="10">store.assertState(expected)</text>
  <text x="189" y="252" text-anchor="middle" fill="#c2410c" font-size="10">store.assertActionsDispatched(...)</text>

  <rect x="364" y="156" width="320" height="110" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="524" y="180" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="700">Navigation Testing</text>
  <line x1="374" y1="188" x2="674" y2="188" stroke="#312e81" stroke-width="1"/>
  <text x="524" y="204" text-anchor="middle" fill="#818cf8" font-size="10">assertNavigationEffect { nav → ... }</text>
  <text x="524" y="220" text-anchor="middle" fill="#818cf8" font-size="10">TestNavigator implements Navigator</text>
  <text x="524" y="236" text-anchor="middle" fill="#6366f1" font-size="10">nav.navigations  ·  nav.navigatedUpCount</text>
  <text x="524" y="252" text-anchor="middle" fill="#4f46e5" font-size="10">nav.poppedBackStackToRoutes</text>

  <rect x="34" y="296" width="310" height="106" rx="10" fill="#1c1917" stroke="#78716c" stroke-width="1.5"/>
  <text x="189" y="320" text-anchor="middle" fill="#d6d3d1" font-size="12" font-weight="700">SpyMiddleware</text>
  <line x1="44" y1="328" x2="334" y2="328" stroke="#44403c" stroke-width="1"/>
  <text x="189" y="344" text-anchor="middle" fill="#a8a29e" font-size="10">MiddlewareCallLog records before/after per action</text>
  <text x="189" y="360" text-anchor="middle" fill="#a8a29e" font-size="10">log.assertOrder("A:before","B:before","B:after","A:after")</text>
  <text x="189" y="376" text-anchor="middle" fill="#78716c" font-size="10">intercept=true swallows action (tests isolation)</text>
  <text x="189" y="392" text-anchor="middle" fill="#57534e" font-size="10">spy.capturedActions verifies what reached middleware</text>

  <rect x="364" y="296" width="320" height="106" rx="10" fill="#042f2e" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5,2"/>
  <text x="524" y="320" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="700">stateDiff() Helper</text>
  <line x1="374" y1="328" x2="674" y2="328" stroke="#134e4a" stroke-width="1"/>
  <text x="524" y="344" text-anchor="middle" fill="#2dd4bf" font-size="10">Available on any ReduceResult</text>
  <text x="524" y="360" text-anchor="middle" fill="#2dd4bf" font-size="10">Returns List&lt;PropertyChange(name, before, after)&gt;</text>
  <text x="524" y="376" text-anchor="middle" fill="#0d9488" font-size="10">Reflection-based — useful for debugging assertion failures</text>
  <text x="524" y="392" text-anchor="middle" fill="#115e59" font-size="10">No setup needed — call .stateDiff() on any ReduceResult</text>
</svg>
