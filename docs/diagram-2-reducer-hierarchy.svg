<svg viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',sans-serif">
  <rect width="720" height="480" fill="#161b22"/>
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#4b5563"/>
    </marker>
    <marker id="arr2-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#0d9488"/>
    </marker>
  </defs>

  <rect x="30" y="20" width="310" height="80" rx="10" fill="#042f2e" stroke="#0d9488" stroke-width="1.5"/>
  <text x="185" y="48" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="700">reducer&lt;S, A, H&gt; { ... }</text>
  <text x="185" y="68" text-anchor="middle" fill="#0d9488" font-size="11">(state: S, action: A, handler: H) → ReduceType</text>
  <text x="185" y="86" text-anchor="middle" fill="#134e4a" font-size="10">Reducer lambda with injected dependency H</text>

  <rect x="380" y="20" width="310" height="80" rx="10" fill="#052e16" stroke="#16a34a" stroke-width="1.5"/>
  <text x="535" y="48" text-anchor="middle" fill="#86efac" font-size="12" font-weight="700">pureReducer&lt;S, A&gt; { ... }</text>
  <text x="535" y="68" text-anchor="middle" fill="#4ade80" font-size="11">(state: S, action: A) → ReduceType</text>
  <text x="535" y="86" text-anchor="middle" fill="#15803d" font-size="10">No dependencies — already a PureReducer</text>

  <line x1="185" y1="100" x2="185" y2="165" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="200" y="138" fill="#6b7280" font-size="10" font-style="italic">wraps into</text>

  <rect x="30" y="168" width="310" height="70" rx="10" fill="#172554" stroke="#2563eb" stroke-width="1.5"/>
  <text x="185" y="196" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">ReducerFactory&lt;S, A, H&gt;</text>
  <text x="185" y="214" text-anchor="middle" fill="#3b82f6" font-size="11">.provide(handler: H) → PureReducer&lt;S, A&gt;</text>
  <text x="185" y="230" text-anchor="middle" fill="#1d4ed8" font-size="10">Partially applies handler; defers binding to ViewModel</text>

  <line x1="185" y1="238" x2="185" y2="288" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arr2-teal)"/>
  <text x="200" y="268" fill="#0d9488" font-size="10" font-style="italic">.provide(handler)</text>

  <path d="M 535 100 L 535 308" stroke="#16a34a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr2)"/>
  <text x="550" y="210" fill="#6b7280" font-size="10" font-style="italic">already PureReducer</text>

  <rect x="200" y="292" width="320" height="70" rx="10" fill="#042f2e" stroke="#0d9488" stroke-width="1.5"/>
  <text x="360" y="320" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="700">PureReducer&lt;S, A&gt;</text>
  <text x="360" y="340" text-anchor="middle" fill="#0d9488" font-size="11">typealias: (S, A) → ReduceType&lt;S, A&gt;</text>
  <text x="360" y="355" text-anchor="middle" fill="#134e4a" font-size="10">Pure function — the unit of test</text>

  <line x1="360" y1="362" x2="360" y2="410" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="375" y="390" fill="#6b7280" font-size="10" font-style="italic">.pullback(lens) or .scoped(handler, lens)</text>

  <rect x="130" y="414" width="500" height="52" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="380" y="439" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="700">PureReducer&lt;GLOBAL, A&gt;</text>
  <text x="380" y="456" text-anchor="middle" fill="#6366f1" font-size="11">Lifted to global state — registered in Map&lt;KClass&lt;*&gt;, PureReducer&lt;GLOBAL, Any&gt;&gt;</text>
</svg>
