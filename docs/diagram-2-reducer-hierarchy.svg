<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',sans-serif">
  <rect width="720" height="380" fill="#161b22"/>
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#4b5563"/>
    </marker>
    <marker id="arr2-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#0d9488"/>
    </marker>
    <marker id="arr2-indigo" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#6366f1"/>
    </marker>
  </defs>

  <rect x="200" y="20" width="320" height="80" rx="10" fill="#052e16" stroke="#16a34a" stroke-width="1.5"/>
  <text x="360" y="50" text-anchor="middle" fill="#86efac" font-size="12" font-weight="700">reducer&lt;S, A&gt; { ... }</text>
  <text x="360" y="70" text-anchor="middle" fill="#4ade80" font-size="11">(state: S, action: A) → ReduceType&lt;S&gt;</text>
  <text x="360" y="88" text-anchor="middle" fill="#15803d" font-size="10">Builder function — creates a Reducer lambda</text>

  <line x1="360" y1="100" x2="360" y2="158" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arr2-teal)"/>
  <text x="375" y="134" fill="#0d9488" font-size="10" font-style="italic">returns</text>

  <rect x="160" y="162" width="400" height="80" rx="10" fill="#042f2e" stroke="#0d9488" stroke-width="1.5"/>
  <text x="360" y="192" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="700">Reducer&lt;S, A&gt;</text>
  <text x="360" y="212" text-anchor="middle" fill="#0d9488" font-size="11">typealias: (state: S, action: A) → ReduceType&lt;S&gt;</text>
  <text x="360" y="228" text-anchor="middle" fill="#134e4a" font-size="10">Pure function — no I/O, no coroutines — the unit of test</text>

  <line x1="360" y1="242" x2="360" y2="296" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="375" y="274" fill="#6b7280" font-size="10" font-style="italic">.pullback(lens)</text>

  <rect x="130" y="300" width="460" height="64" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="360" y="330" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="700">Reducer&lt;GLOBAL, A&gt;</text>
  <text x="360" y="349" text-anchor="middle" fill="#6366f1" font-size="11">Lifted to global state — registered in Map&lt;KClass&lt;*&gt;, Reducer&lt;GLOBAL, Any&gt;&gt;</text>
</svg>
