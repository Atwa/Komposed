  <text x="360" y="78" text-anchor="middle" fill="#818cf8" font-size="11">deliveryState: DeliveryState</text>
  <text x="360" y="96" text-anchor="middle" fill="#818cf8" font-size="11">billState: BillState</text>
  <text x="360" y="113" text-anchor="middle" fill="#818cf8" font-size="11">placeOrderState: PlaceOrderState</text>

  <path d="M 240 72 L 175 72 L 175 195" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/>
  <line x1="360" y1="120" x2="360" y2="195" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr3)"/>
  <path d="M 480 99 L 545 99 L 545 195" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/>

  <text x="135" y="145" fill="#6b7280" font-size="10" font-style="italic">deliveryLens</text>
  <text x="313" y="165" fill="#6b7280" font-size="10" font-style="italic">billLens</text>
  <text x="548" y="145" fill="#6b7280" font-size="10" font-style="italic">placeOrderLens</text>

