<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',sans-serif">
  <rect width="720" height="400" fill="#161b22"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#4b5563"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title/Root -->
  <rect x="240" y="20" width="240" height="50" rx="10" fill="#1c1917" stroke="#78716c" stroke-width="1.5"/>
  <text x="360" y="43" text-anchor="middle" fill="#d6d3d1" font-size="14" font-weight="700">Effect</text>
  <text x="360" y="60" text-anchor="middle" fill="#78716c" font-size="10">Marker interface for all side effects</text>

  <line x1="360" y1="70" x2="360" y2="100" stroke="#374151" stroke-width="1.5"/>
  <line x1="180" y1="100" x2="540" y2="100" stroke="#374151" stroke-width="1.5"/>
  <line x1="180" y1="100" x2="180" y2="130" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="540" y1="100" x2="540" y2="130" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Built-in: NavigationEffect -->
  <rect x="40" y="130" width="280" height="100" rx="10" fill="#2e1065" stroke="#9333ea" stroke-width="1.5"/>
  <text x="180" y="155" text-anchor="middle" fill="#d8b4fe" font-size="13" font-weight="700">NavigationEffect</text>
  <text x="180" y="172" text-anchor="middle" fill="#c084fc" font-size="10">Built-in library effect</text>
  <line x1="55" y1="180" x2="305" y2="180" stroke="#581c87" stroke-width="1"/>
  <text x="180" y="198" text-anchor="middle" fill="#9333ea" font-size="10">block: Navigator.() -> Unit</text>
  <text x="180" y="212" text-anchor="middle" fill="#7e22ce" font-size="10">Handled by navigationMiddleware</text>

  <!-- Custom Feature Effects -->
  <rect x="400" y="130" width="280" height="100" rx="10" fill="#170c3a" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="540" y="155" text-anchor="middle" fill="#c084fc" font-size="13" font-weight="700">Feature Effects</text>
  <text x="540" y="172" text-anchor="middle" fill="#9333ea" font-size="10">Sealed interface in feature module</text>
  <line x1="415" y1="180" x2="665" y2="180" stroke="#4c1d95" stroke-width="1"/>
  <text x="540" y="198" text-anchor="middle" fill="#a855f7" font-size="10">e.g. FetchOrderDetails : OrderEffect</text>
  <text x="540" y="212" text-anchor="middle" fill="#a855f7" font-size="10">Handled by registered EffectHandlers</text>

  <!-- Effect Processing -->
  <rect x="40" y="270" width="640" height="90" rx="10" fill="#042f2e" stroke="#0d9488" stroke-width="1.5"/>
  <text x="360" y="295" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="700">EffectHandler&lt;E, A&gt;</text>
  <text x="360" y="312" text-anchor="middle" fill="#0d9488" font-size="11">Processes Effects and optionally dispatches Actions</text>

  <line x1="60" y1="322" x2="660" y2="322" stroke="#134e4a" stroke-width="1"/>

  <text x="100" y="342" fill="#2dd4bf" font-size="10" font-weight="600">suspend handle(effect, dispatch)</text>
  <text x="400" y="342" fill="#14b8a6" font-size="10">dispatch { Action }  ·  flow.collect { dispatch { it } }</text>
  <text x="360" y="356" text-anchor="middle" fill="#115e59" font-size="9">Registered via effectHandlers { ... } DSL in the Store</text>

  <path d="M 680 315 L 705 315 L 705 45 L 690 45" stroke="#16a34a" stroke-width="1.2" fill="none" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>
  <text x="695" y="180" fill="#16a34a" font-size="9" transform="rotate(90,695,180)" text-anchor="middle">dispatched Actions re-enter the Store</text>
</svg>
